experiment:
  name: llama3.2_1b_fft
  seed: 42
model:
  name: meta-llama/Llama-3.2-1B
  dtype: bfloat16
method:
  name: fft
data:
  dataset_name: yahma/alpaca-cleaned
  max_length: 256
  batch_size: 1
  train_samples: 1000
training:
  learning_rate: 2.0e-05
  weight_decay: 0.01
  max_steps: 200
  warmup_steps: 20
  gradient_clip: 1.0
tracking:
  log_dir: logs
