experiment:
  name: nemotron_mini_4b_fft
  seed: 42
model:
  name: nvidia/Nemotron-Mini-4B-Instruct
  dtype: bfloat16
method:
  name: fft
data:
  dataset_name: yahma/alpaca-cleaned
  max_length: 256
  batch_size: 1
  train_samples: 1000
training:
  learning_rate: 2.0e-05
  weight_decay: 0.01
  max_steps: 100
  warmup_steps: 10
  gradient_clip: 1.0
tracking:
  log_dir: logs
