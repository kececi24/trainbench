experiment:
  name: llama3.1_8b_lora
  seed: 42
model:
  name: meta-llama/Llama-3.1-8B
  dtype: bfloat16
method:
  name: lora
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  use_dora: false
data:
  dataset_name: yahma/alpaca-cleaned
  max_length: 256
  batch_size: 1
  train_samples: 1000
training:
  learning_rate: 0.0002
  weight_decay: 0.01
  max_steps: 200
  warmup_steps: 20
  gradient_clip: 1.0
tracking:
  log_dir: logs
