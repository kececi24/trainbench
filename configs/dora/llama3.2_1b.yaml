experiment:
  name: llama3.2_1b_dora
  seed: 42
model:
  name: meta-llama/Llama-3.2-1B
  dtype: bfloat16
method:
  name: dora
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  use_dora: true
data:
  dataset_name: yahma/alpaca-cleaned
  max_length: 256
  batch_size: 2
  train_samples: 1000
training:
  learning_rate: 0.0002
  weight_decay: 0.01
  max_steps: 100
  warmup_steps: 10
  gradient_clip: 1.0
tracking:
  log_dir: logs
