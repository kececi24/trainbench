experiment:
  name: gpt2_medium_dora
  seed: 42
model:
  name: openai-community/gpt2-medium
  dtype: float16
method:
  name: dora
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
  - c_attn
  - c_proj
  use_dora: true
data:
  dataset_name: yahma/alpaca-cleaned
  max_length: 256
  batch_size: 4
  train_samples: 1000
training:
  learning_rate: 0.0002
  weight_decay: 0.01
  max_steps: 200
  warmup_steps: 20
  gradient_clip: 1.0
tracking:
  log_dir: logs
